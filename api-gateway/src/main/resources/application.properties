spring.application.name=api-gateway

server.port=8085

security.jwt.secret=${JWT_SECRET:REMOVED_JWT_SECRET=}
logging.structured.format.console=ecs

gateway.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
gateway.course-service.url=${COURSE_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info

