# =============================================================================
# COURSE SERVICE — SERVICE
# =============================================================================
# Internal ClusterIP service so api-gateway can reach course-service at:
#   http://course-service:8082  (within the lms namespace)
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: lms
spec:
  selector:
    app: course-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
