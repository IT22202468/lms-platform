services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    image: ghcr.io/it22202468/auth-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: ${JWT_SECRET:-REMOVED_JWT_SECRET=}
    depends_on:
      mongodb:
        condition: service_healthy

  course-service:
    image: ghcr.io/it22202468/course-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/coursedb
      JWT_SECRET: ${JWT_SECRET:-REMOVED_JWT_SECRET=}
    depends_on:
      mongodb:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/it22202468/api-gateway:latest
    ports:
      - "8085:8085"
    environment:
      JWT_SECRET: ${JWT_SECRET:-REMOVED_JWT_SECRET=}
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,https://otterspacelearn.vercel.app
    depends_on:
      - auth-service
      - course-service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - auth-service
      - course-service
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning/:/etc/grafana/provisioning/:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo-data:
  grafana-data: