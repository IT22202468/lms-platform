services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          memory: 224M
        reservations:
          memory: 160M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  auth-service:
    image: ghcr.io/it22202468/auth-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: ${MONGODB_URI}/authdb?ssl=true&replicaSet=atlas-12y3b2-shard-0&authSource=admin&retryWrites=true&w=majority&appName=LMS-Cluster
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_HEALTH_MONGO_ENABLED: "false"
      MANAGEMENT_HEALTH_MONGODB_ENABLED: "false"
      JDK_JAVA_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=75.0
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx100m
    depends_on:
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 144M
        reservations:
          memory: 64M

  course-service:
    image: ghcr.io/it22202468/course-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_MONGODB_URI: ${MONGODB_URI}/coursedb?ssl=true&replicaSet=atlas-12y3b2-shard-0&authSource=admin&retryWrites=true&w=majority&appName=LMS-Cluster
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      APP_UPLOAD_DIR: /data/uploads
      MANAGEMENT_HEALTH_MONGO_ENABLED: "false"
      MANAGEMENT_HEALTH_MONGODB_ENABLED: "false"
      JDK_JAVA_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=75.0
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx100m
    depends_on:
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 144M
        reservations:
          memory: 64M
    volumes:
      - course-uploads:/data/uploads

  notification-service:
    image: ghcr.io/it22202468/notification-service:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JDK_JAVA_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=75.0
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx100m
    depends_on:
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 144M
        reservations:
          memory: 64M

  api-gateway:
    image: ghcr.io/it22202468/api-gateway:latest
    ports:
      - "8085:8085"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://otterspacelearn.vercel.app}
      JDK_JAVA_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=75.0
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx100m
    depends_on:
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      notification-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 144M
        reservations:
          memory: 64M

volumes:
  course-uploads:
