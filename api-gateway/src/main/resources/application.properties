spring.application.name=api-gateway

server.port=8085

security.jwt.secret=${JWT_SECRET:REMOVED_JWT_SECRET=}
logging.structured.format.console=ecs

gateway.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
gateway.course-service.url=${COURSE_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=60MB
# Let multipart stream through to downstream when proxying (Gateway MVC); avoids empty/parsed bodies at course-service.
spring.servlet.multipart.resolve-lazily=true

spring.codec.max-in-memory-size=12MB

server.tomcat.max-http-form-post-size=60000000

