services:
  auth-service:
    image: ghcr.io/it22202468/auth-service:latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}/authdb?retryWrites=true&w=majority&appName=LMS-Cluster
      JWT_SECRET: ${JWT_SECRET}
      JDK_JAVA_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=70.0
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx160m
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  course-service:
    image: ghcr.io/it22202468/course-service:latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}/coursedb?retryWrites=true&w=majority&appName=LMS-Cluster
      JWT_SECRET: ${JWT_SECRET}
      JDK_JAVA_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=70.0
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx160m
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  api-gateway:
    image: ghcr.io/it22202468/api-gateway:latest
    ports:
      - "8085:8085"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      JDK_JAVA_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=70.0
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx128m
    depends_on:
      - auth-service
      - course-service
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 48M
