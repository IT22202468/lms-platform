global:
  scrape_interval: 15s      # pull metrics from every service every 15 seconds
  evaluation_interval: 15s  # evaluate alerting rules every 15 seconds

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8081']
    metrics_path: '/actuator/prometheus'

  - job_name: 'course-service'
    static_configs:
      - targets: ['course-service:8082']
    metrics_path: '/actuator/prometheus'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8085']
    metrics_path: '/actuator/prometheus'
