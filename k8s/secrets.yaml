# =============================================================================
# KUBERNETES SECRETS
# =============================================================================
# Secrets replace your .env file. Kubernetes stores these as base64-encoded
# values and injects them into pods as environment variables.
#
# HOW TO ENCODE VALUES:
#   echo -n "your-actual-value" | base64
#
# HOW TO APPLY:
#   kubectl apply -f k8s/secrets.yaml
#
# IMPORTANT: Never commit real secret values to git.
# In production, use Sealed Secrets or HashiCorp Vault instead.
# =============================================================================

