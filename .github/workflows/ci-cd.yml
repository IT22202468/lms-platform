name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Test + Coverage (all triggers)
  # ─────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, course-service, api-gateway]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and enforce coverage
        working-directory: ${{ matrix.service }}
        run: ./mvnw verify -B
        env:
          SPRING_MONGODB_URI: mongodb://localhost:27017/testdb

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2 — SonarQube Analysis (push only)
  # ─────────────────────────────────────────────
  sonar:
    name: Sonar · ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push'
    # if: github.event_name == 'push' && secrets.SONAR_HOST_URL != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, course-service, api-gateway]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test and analyze with SonarCloud
        working-directory: ${{ matrix.service }}
        run: >
          ./mvnw verify sonar:sonar -B
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SPRING_MONGODB_URI: mongodb://localhost:27017/testdb

  # ─────────────────────────────────────────────
  # Job 3 — Build & Push to ghcr.io (push only)
  # ─────────────────────────────────────────────
  build-push:
    name: Build & Push · ${{ matrix.service }}
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, course-service, api-gateway]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:latest

  # ─────────────────────────────────────────────
  # Job 4 — Deploy to Oracle VM (main only)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VM
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/lms-platform
            git pull origin main
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export MONGODB_URI="${{ secrets.MONGODB_URI }}"
            # MONGODB_URI should be the base URI without database name:
            # mongodb+srv://<user>:<pass>@lms-cluster.oyibf3f.mongodb.net
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
