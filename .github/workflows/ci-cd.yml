name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Test + Coverage (all triggers)
  # ─────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, course-service, api-gateway]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and enforce coverage
        working-directory: ${{ matrix.service }}
        run: ./mvnw verify -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/testdb

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2 — Build & Push to ghcr.io (push only)
  # ─────────────────────────────────────────────
  build-push:
    name: Build & Push · ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, course-service, api-gateway]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:latest

  # ─────────────────────────────────────────────
  # Job 3 — Deploy to Kubernetes (main only)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Sync K8s Secret from GitHub secrets
        run: |
          kubectl create secret generic lms-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=AUTH_MONGODB_URI="mongodb://mongodb:27017/authdb" \
            --from-literal=COURSE_MONGODB_URI="mongodb://mongodb:27017/coursedb" \
            --namespace=lms \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply MongoDB
        run: kubectl apply -f k8s/mongodb/

      - name: Apply Services
        run: |
          kubectl apply -f k8s/auth-service/service.yaml
          kubectl apply -f k8s/course-service/service.yaml
          kubectl apply -f k8s/api-gateway/service.yaml

      - name: Apply Deployments
        run: |
          kubectl apply -f k8s/auth-service/deployment.yaml
          kubectl apply -f k8s/course-service/deployment.yaml
          kubectl apply -f k8s/api-gateway/deployment.yaml

      - name: Update image tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG=sha-${{ github.sha }}

          kubectl set image deployment/auth-service \
            auth-service=${{ env.REGISTRY }}/${OWNER}/auth-service:${TAG} -n lms

          kubectl set image deployment/course-service \
            course-service=${{ env.REGISTRY }}/${OWNER}/course-service:${TAG} -n lms

          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.REGISTRY }}/${OWNER}/api-gateway:${TAG} -n lms

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-service   -n lms --timeout=120s
          kubectl rollout status deployment/course-service -n lms --timeout=120s
          kubectl rollout status deployment/api-gateway    -n lms --timeout=120s
