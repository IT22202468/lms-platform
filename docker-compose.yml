services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    image: lms/auth-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: ${JWT_SECRET:-REMOVED_JWT_SECRET=}
    depends_on:
      mongodb:
        condition: service_healthy

  course-service:
    build: ./course-service
    image: lms/course-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/coursedb
      JWT_SECRET: ${JWT_SECRET:-REMOVED_JWT_SECRET=}
    depends_on:
      mongodb:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    image: lms/api-gateway:latest
    ports:
      - "8085:8085"
    environment:
      JWT_SECRET: ${JWT_SECRET:-REMOVED_JWT_SECRET=}
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
    depends_on:
      - auth-service
      - course-service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - auth-service
      - course-service
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
