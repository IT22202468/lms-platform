services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' --quiet || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M

  auth-service:
    image: ghcr.io/it22202468/auth-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xms64m -Xmx192m"
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  course-service:
    image: ghcr.io/it22202468/course-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/coursedb
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xms64m -Xmx192m"
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  api-gateway:
    image: ghcr.io/it22202468/api-gateway:latest
    ports:
      - "8085:8085"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      JAVA_OPTS: "-Xms64m -Xmx192m"
    depends_on:
      - auth-service
      - course-service
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mongo-data:
