# =============================================================================
# AUTH SERVICE — SERVICE
# =============================================================================
# A Service gives your pods a stable internal DNS name and IP address.
# Without this, pods get random IPs that change every restart.
#
# DOCKER COMPOSE EQUIVALENT:
#   Docker Compose automatically creates an internal network where services
#   can reach each other by name (e.g. http://auth-service:8081).
#   A Kubernetes Service does the same thing — it's not automatic here.
#
# After applying this, other pods in the cluster can reach auth-service at:
#   http://auth-service.lms.svc.cluster.local:8081
# Or simply:
#   http://auth-service:8081  (within the same namespace)
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: lms
spec:
  selector:
    app: auth-service             # Routes traffic to pods with this label
  ports:
    - protocol: TCP
      port: 8081                  # Port the Service listens on
      targetPort: 8081            # Port the container listens on
  type: ClusterIP                 # ClusterIP = internal only (not exposed outside cluster)
