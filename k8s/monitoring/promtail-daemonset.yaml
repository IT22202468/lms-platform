apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: lms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: lms
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: lms
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods in the lms namespace
          - source_labels: [__meta_kubernetes_namespace]
            regex: lms
            action: keep
          # Use pod name as the 'pod' label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Use the app label as the 'service' label
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          # Use the namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        pipeline_stages:
          # Services log ECS JSON — parse level and service name
          - json:
              expressions:
                log_level: 'log.level'
                service_name: 'service.name'
          - labels:
              log_level:
              service_name:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: lms
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:latest
          args:
            - -config.file=/etc/promtail/config.yml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
