# =============================================================================
# API GATEWAY — HORIZONTAL POD AUTOSCALER
# =============================================================================
# The api-gateway is the first to receive traffic spikes, so we scale it
# aggressively — lower CPU threshold, more max replicas than auth-service.
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: lms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  # Scale sooner (60%) since this is the entry point
