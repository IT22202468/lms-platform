name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: lms

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Test + Coverage (all triggers)
  # ─────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, course-service, api-gateway]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and enforce coverage
        working-directory: ${{ matrix.service }}
        run: ./mvnw verify -B
        env:
          SPRING_MONGODB_URI: mongodb://localhost:27017/testdb

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2 — SonarCloud Analysis (push & PR)
  # ─────────────────────────────────────────────
  sonar:
    name: Sonar · ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            sonar_token_name: SONAR_TOKEN_AUTH
          - service: course-service
            sonar_token_name: SONAR_TOKEN_COURSE
          - service: api-gateway
            sonar_token_name: SONAR_TOKEN_GATEWAY

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        working-directory: ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets[matrix.sonar_token_name] }}
          SPRING_MONGODB_URI: mongodb://localhost:27017/testdb
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Running SonarCloud analysis for ${{ matrix.service }} (attempt ${attempt}/3)"

            if ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.branch.name=${{ github.ref_name }}; then
              exit 0
            fi

            if [[ ${attempt} -lt 3 ]]; then
              sleep $((attempt * 10))
              echo "SonarCloud analysis failed, retrying..."
            fi
          done

          echo "SonarCloud analysis failed after 3 attempts"
          exit 1

  # ─────────────────────────────────────────────
  # Job 3 — Build & Push to ghcr.io (push only)
  # ─────────────────────────────────────────────
  build-push:
    name: Build & Push · ${{ matrix.service }}
    needs: [sonar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, course-service, api-gateway]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:latest

  # ─────────────────────────────────────────────
  # Job 4 — Deploy to VM (main branch only)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VM
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/lms-platform
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
        